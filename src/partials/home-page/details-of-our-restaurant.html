<section class="restaurant-details">
  <div class="restaurant-details__gradient">
    <div class="container">
      <div class="restaurant-details__meta">
        <h2
          class="company-title company-title--inverse restaurant-details__company-title"
        >
          mimiho
        </h2>
        <h3 class="restaurant-details__subtitle">Ресторан</h3>
        <p class="restaurant-details__description">
          Amet minim mollit non deserunt ullamco est sit aliqua dolor do amet
          sint. Velit officia consequat duis enim velit mollit.
        </p>
      </div>
      <div class="restaurant-details__thumb">
        <div class="details-slider slider">
          <div class="details-slider__list slider-list">
            <ul class="list details-slider__track slider-track">
              <li class="details-slider__slide slide">
                <img
                  class="details-slider__image"
                  src="./images/desktop-images/slider/homepage-restaurant-section-slider-image1-254.jpg"
                  alt="Фото ресторану 1"
                  width="270"
                  height="270"
                />
              </li>
              <li class="details-slider__slide slide">
                <img
                  class="details-slider__image"
                  src="./images/desktop-images/slider/homepage-restaurant-section-slider-image2-254.jpg"
                  alt="Фото ресторану 2"
                  width="270"
                  height="270"
                />
              </li>
              <li class="details-slider__slide slide">
                <img
                  class="details-slider__image"
                  src="./images/desktop-images/slider/homepage-restaurant-section-slider-image3-270.jpg"
                  alt="Фото ресторану 3"
                  width="270"
                  height="270"
                />
              </li>
            </ul>
          </div>

          <div class="details-slider__arrows slider-arrows">
            <button type="button" class="details-slider__button prev">
              <svg width="32" height="32" class="details-slider__icon">
                <use href="./images/icons.svg#icon-arrow-left"></use>
              </svg>
            </button>
            <button type="button" class="details-slider__button next">
              <svg width="32" height="32" class="details-slider__icon">
                <use href="./images/icons.svg#icon-arrow-right"></use>
              </svg>
            </button>
          </div>
        </div>
        <div class="button-container">
          <button
            class="button restaurant-details__button js-open-modal"
            data-modal="1"
          >
            Забронювати столик
          </button>
          <a
            href="./restaurant-page.html#menu-anchor"
            class="restaurant-link button restaurant-details__button"
          >
            Переглянути меню
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
