<section class="restaurant-details restaurant-details--hotel">
  <div class="restaurant-details__gradient">
    <div class="container">
      <div class="restaurant-details__meta restaurant-details__meta--hotel">
        <h2
          href=""
          class="company-title company-title--inverse restaurant-details__company-title"
        >
          mimiho
        </h2>
        <h3 class="restaurant-details__subtitle">Готель</h3>
        <p
          class="restaurant-details__description restaurant-details__description--hotel"
        >
          Amet minim mollit non deserunt ullamco est sit aliqua dolor do amet
          sint. Velit officia consequat duis enim velit mollit.
        </p>
      </div>
      <div class="restaurant-details__thumb restaurant-details__thumb--hotel">
        <div class="details-slider details-slider--hotel slider">
          <div class="details-slider__list slider-list">
            <ul class="list details-slider__track slider-track">
              <li class="details-slider__slide slide">
                <img
                  class="details-slider__image"
                  src="./images/desktop-images/slider/homepage-hotel-section-slider-image1-245.jpg"
                  alt="Фото готелю 1"
                  width="270"
                  height="270"
                />
              </li>
              <li class="details-slider__slide slide">
                <img
                  class="details-slider__image"
                  src="./images/desktop-images/slider/homepage-hotel-section-slider-image2-245.jpg"
                  alt="Фото готелю 2"
                  width="270"
                  height="270"
                />
              </li>
              <li class="details-slider__slide slide">
                <img
                  class="details-slider__image"
                  src="./images/desktop-images/slider/homepage-hotel-section-slider-image3-270.jpg"
                  alt="Фото готелю 3"
                  width="270"
                  height="270"
                />
              </li>
            </ul>
          </div>

          <div class="details-slider__arrows slider-arrows">
            <button type="button" class="details-slider__button prev">
              <svg width="32" height="32" class="details-slider__icon">
                <use href="./images/icons.svg#icon-arrow-left"></use>
              </svg>
            </button>
            <button type="button" class="details-slider__button next">
              <svg width="32" height="32" class="details-slider__icon">
                <use href="./images/icons.svg#icon-arrow-right"></use>
              </svg>
            </button>
          </div>
        </div>
        <div class="button-container button-container--hotel">
          <button
            class="button restaurant-details__button js-open-modal"
            data-modal="2"
          >
            Забронювати номер
          </button>
          <button
            class="button restaurant-details__button js-open-modal"
            data-modal="3"
          >
            Переглянути ціни
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
